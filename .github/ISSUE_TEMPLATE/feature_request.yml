name: Feature request
description: Suggest an idea or capability for Enhanced Terminal MCP
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [README](https://github.com/flashboomlight/Enhanced-Terminal-MCP#readme) tool reference and existing issues first — your idea may already be covered.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case and why the current tools do not cover it.
      placeholder: I'm trying to ... but ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What the tool/server should do. If it is a new tool or changes an existing tool's contract, sketch the input/output shape.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered, including doing it client-side.
    validations:
      required: false
