items:
  - slug: hardening-contract-and-profiles
    description: 定义统一 RequestContext、CapabilityPolicy、ExecutionRequest、InputBudget、ExecutionLimits、BudgetAccount、部署 profile 和结构化错误兼容契约
    depends_on: []
    status: done
    feature: 2026-08-28-hardening-contract-and-profiles
    minimal_loop: false
    notes: 已完成并通过 acceptance；所有后续 feature-design 的硬约束输入；finite/bounded schema、byte-count、parent budget、action schema、capability 和错误码兼容必须先定

  - slug: process-supervisor-and-cancellation
    description: 建立覆盖全部生产 child process 的 active registry、timeout、AbortSignal、pending capture queue、process tree 终止和 shutdown drain
    depends_on: [hardening-contract-and-profiles]
    status: done
    feature: 2026-08-28-process-supervisor-and-cancellation
    minimal_loop: false
    notes: 已完成并通过 acceptance；全部生产 spawn/execFile/probe 经 supervisor registry 纳管，Windows PID-only taskkill /T /F、Unix 进程组信号，capture pending 有界，RequestContext cancellation 贯穿 command/search/system/archive，shutdown 先 drain 再 flush。验收期间修复 registry cleanup 竞态（close 与 termination promise 完成顺序不确定导致 activeCount 残留）、lint 与 cancel 测试 bounded 等待边界。后代进程/descendant budget 按 roadmap 归属 bounded-command-execution；Unix 真实树终止 smoke 归属后续 conformance gate

  - slug: bounded-command-execution
    description: 为三个命令工具接入 finite 输入、batch parent/watch/并发/输出/响应/queue 预算和统一限流，形成可取消的最小命令闭环
    depends_on: [process-supervisor-and-cancellation]
    status: done
    feature: 2026-08-28-bounded-command-execution
    minimal_loop: true
    notes: 已完成并通过 acceptance；三个命令工具 schema 收紧（finiteInt/boundedString/boundedArray）+ handler 层 validateBoundedCommandInput 二次校验（direct call 不绕过）；batch_execute 建立 parent BudgetAccount——聚合输入预检 RESOURCE_LIMIT 零执行、output 逐条 reserve 耗尽后 budget_output skipped、wall-time deadline 到点 budget_deadline skipped、parallel 子任务经 child() 共享 parent ledger；预算为启动常量未接 profile 配置面，配置化归属后续 backend feature

  - slug: kill-process-identity
    description: 将 kill_process 收敛为唯一 pid 或精确进程身份 proof，拒绝 wildcard、PID reuse、重名和危险批量终止
    depends_on: [hardening-contract-and-profiles]
    status: done
    feature: 2026-08-28-kill-process-identity
    minimal_loop: false
    notes: 已完成并通过 acceptance；使用 Windows Process handle/start time、Linux /proc start time、macOS ps recheck；需要后续 supervisor 接管全局 process tree/lifecycle

  - slug: path-policy-no-follow
    description: 统一 realpath、parent path、no-follow、symlink/reparse 和 TOCTOU 防护并覆盖文件、session、state、temp、page-cache 和归档操作
    depends_on: [hardening-contract-and-profiles]
    status: done
    feature: 2026-08-29-path-policy-no-follow
    minimal_loop: false
    notes: 已完成并通过 acceptance；新增 src/path-policy.ts（resolveForRead/resolveForWrite/atomicWriteFile/assertSafeStateRoot）统一接入 files 五工具、manage 两工具、session cwd 恢复与 state/temp 根；读语义 real 解析重验、写/删/移 no-follow（symlink 目标拒绝，delete 对链接仅移除链接本身）、覆写走原子 staging+rename、state/temp 根防替换。归档内容的 Zip Slip 与下载路径注入归属 network-and-archive-safety；session_state.set_cwd 入口校验归属 tool-wrapper-and-surface-contract

  - slug: secret-redaction-and-state-protection
    description: 建立 streaming secret scan、命令/日志/error/result/prompt redaction、大小写不敏感 env policy 和安全 session/cache 持久化
    depends_on: [hardening-contract-and-profiles, path-policy-no-follow]
    status: done
    feature: 2026-08-29-secret-redaction-and-state-protection
    minimal_loop: false
    notes: 已完成并通过 acceptance；新增 src/secret-governance.ts（redactor/env policy/redactError），fail() 单点 ResultBoundary，logger/audit/prompt/confirmation/fatal 出口净化，session 默认只持久化 envKeys 与 redacted history（value 持久化需 MCP_SESSION_PERSIST_ENV_VALUES=1 且 denied/sensitive 永不落盘），env deny 大小写规范化（path/node_options 变体关闭），scan 增加 complete 语义且 strict 超能力 fail-closed（RESOURCE_LIMIT），environment_vars 值展示策略（MCP_ENV_VALUE_MODE 默认 allowlist）并移出 CACHEABLE_TOOLS，session.json 走 atomicWriteFile、audit/state/temp POSIX 权限收紧。命令输出流式 matcher（secret-stream/secret-registry）零改动；audit writer 轮换与 session revision writer 归 audit-health-and-state-writer，capability 矩阵归 tool-wrapper-and-surface-contract

  - slug: network-and-archive-safety
    description: 为 download、redirect、network_info、compress 和 extract 增加 SSRF/DNS/proxy 防护、byte budget、archive manifest 和 zip bomb/Zip Slip/link-entry 防护
    depends_on: [hardening-contract-and-profiles, path-policy-no-follow]
    status: done
    feature: 2026-08-29-network-and-archive-safety
    minimal_loop: false
    notes: 已完成并通过 acceptance；新增 src/network-policy.ts（SSRF 分类矩阵 deny-private/allow-private、直连已验证 IP 关闭 DNS rebinding、逐跳 redirect 重验、字节/双路 deadline 预算跨重试共享、代理变量零读取）与 src/zip-policy.ts（EOCD/ZIP64/CD manifest、Zip Slip/驱动器号/保留设备名/链接设备加密条目拒绝、双路展开预算+压缩比守卫、staging 两阶段解压零残留）；download/extract 换纯 Node 实现（零新增依赖），compress spawn 前源树预算预演，network_info ping/dns 接入 egress 校验；9 个配置项见 README；capability 矩阵归 tool-wrapper-and-surface-contract

  - slug: audit-health-and-state-writer
    description: 修复 session/audit/temp/cache 的并发、失败恢复、轮换、权限、bounded queue 和 truthful health 状态
    depends_on: [secret-redaction-and-state-protection, process-supervisor-and-cancellation]
    status: done
    feature: 2026-08-29-audit-health-and-state-writer
    minimal_loop: false
    notes: 已完成并通过 acceptance；新增 src/lock-lease.ts（owner/lease heartbeat/fencing token、staging+rename 原子接管、token 校验释放）统一 temp lock 与 migration lock——心跳存活的长持锁不再被 mtime 接管，崩溃 owner 立即接管，corrupt/未知迁移锁保持 fail-closed（4.5 协议兼容）；audit 改单飞行写链（失败保留 + 5s 退避重试，连续 3 次 health failed），record/flush/health 落 §5.7 契约，entry/queue 字节上限（截断骨架/丢最旧计 dropped）+ 按大小轮换 audit.jsonl.N（既有条数 compact 保留）；session revision writer 以 revision 比对修复写窗口 dirty 竞态（写后必补写）并串行化并发保存；temp 跨进程配额经 temp/.quota.json ledger 互见 outstanding（本进程取内存 live 值防双计、死 pid 残留回收、协调文件不计容量）；LRU 超 maxEntryBytes 拒绝入缓存并计数；health://status 从恒 ok 改为 healthy/degraded/failed + components{audit,temp,process,session} 聚合（temp 连续 ≥3 次锁失败才 degraded）。新增配置 5 项见 README。门禁全绿（全量 63 文件 786 用例、latency 24/24、tools coverage 59.39/49.79/67.32/63.16）。durable spool 与时间轮换按 §5.7 二选一明确不做；按时间轮换若需另立 issue

  - slug: tool-wrapper-and-surface-contract
    description: 统一 wrapHandler 异常兜底、MCP request context/cancellation、action schema、structured result/response budget 和真实启用工具数量
    depends_on: [hardening-contract-and-profiles]
    status: done
    feature: 2026-08-29-tool-wrapper-and-surface-contract
    minimal_loop: false
    notes: 已完成并通过 acceptance；新增 src/tool-registry.ts（registerManagedTool 记账，getRegisteredToolCount/getEnabledToolNames 读 SDK RegisteredTool.enabled，§5.7 activeCount/activeNames 适配），27 处注册点机械替换后工具文件零 server.registerTool 残留；wrapHandler try/catch 收敛 rejected promise（aborted/AbortError→CANCELLED，其余经 redactError→INTERNAL_ERROR，错误不入缓存）；MCP_RESPONSE_MAX_BYTES（默认 2 MiB，非法回落+warn）超限→RESOURCE_LIMIT；session_state/environment_vars/network_info 缺参 handler 层显式 VALIDATION_ERROR（param 指向缺失字段；SDK 1.29 normalizeObjectSchema 对 v3 ZodEffects 返回 undefined 会把 inputSchema 广告成空 schema，故不用 schema refine，隐式 ping 127.0.0.1/localhost 默认删除）；capabilityGate 接线 process_list/get_system_info/network_info/download_file/environment_vars 五披露面（local 全放行，sandboxed 未声明→CAPABILITY_DENIED）；health 增加 tools.enabled/disabled，banner/usage-guide/prompt 与 tools/list 27/26 三面同源一致（e2e 双配置验证）。sandboxed 端到端 capability e2e 归 #12；SDK 升级属独立 feature

  - slug: search-and-adaptive-correctness
    description: 修复 everything_search 错误吞掉、native search partial-result/预算/取消、目录边界、Unix process filter 和 adaptive timeout 语义不一致
    depends_on: [bounded-command-execution, tool-wrapper-and-surface-contract]
    status: done
    feature: 2026-08-29-search-and-adaptive-correctness
    minimal_loop: false
    notes: 已完成并通过 acceptance；新增 src/partial-result.ts（SearchWarning/WARNING_CODES/SEARCH_BUDGET/pushWarning/assert 同源校验）与 src/native-search.ts（walk/grep 遍历错误收集 complete=false+warnings、命中行 1000 截断、迭代 AbortError）；everything_search 错误分类（timedOut→TIMEOUT、maxBuffer→RESOURCE_LIMIT、其余→EXECUTION_FAILED 有限 detail {exitCode,signal}），search_files CLI 失败 warn+EVERYTHING_EXEC_FAILED 后 native fallback；PS grep 两段 -ErrorVariable 合计 ETMCP_PARTIAL_ERRORS=N 经 stderr 回传解析、Unix grep 非零+有输出→GREP_PARTIAL_RESULTS；list_directory 递归子目录不可读 partial、顶层仍整体失败；搜索/list/process schema+handler 双层有界校验（越界 VALIDATION_ERROR）；Unix process_list 重写为 buildUnixProcessListCommand 先筛选再 sort -k4,4 -rn 再 head（关闭 SYS-01 全量泄露）；adaptiveTimeout 改非 cache-hit 样本 nearest-rank P95×3（上限 4×base、样本<5 回退，关闭 PERF-01）；partial 结果不入 LRU 缓存；四工具输出补 complete/warnings/truncated（纯新增向后兼容，关闭 SEARCH-01/02）。Unix 真实 smoke 与 TTL/rename flake 加固归 #12

