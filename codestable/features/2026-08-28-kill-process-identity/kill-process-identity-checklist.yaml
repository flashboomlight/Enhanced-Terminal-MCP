    source: 5.8 进程身份契约 / 验收场景 S1-S2
    status: passed
  - item: "PID 使用 finite safe integer 与平台边界，name 使用有界 reject-style validator，不静默 sanitize"
    source: 输入契约 / 验收场景 S3-S4
    status: passed
  - item: "精确名称只允许唯一候选，零候选和多候选不调用 terminate"
    source: 5.8 进程身份契约 / 验收场景 S5-S6
    status: passed
  - item: "PID/name 唯一候选都取得可重验 identity token/start time"
    source: identity proof / 验收场景 S7-S8
    status: passed
  - item: "Windows 不生成 /IM，Unix 不生成 pkill，终止凭据绑定 verified PID/handle/group"
    source: D2-D4 / 验收场景 S9-S10
    status: passed
  - item: "critical/self/parent/protected process 在副作用前拒绝，既有 SafeGuard 不被绕过"
