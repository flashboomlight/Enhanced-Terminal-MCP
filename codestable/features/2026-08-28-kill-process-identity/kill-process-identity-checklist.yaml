feature: 2026-08-28-kill-process-identity
created: 2026-08-28

steps:
  - action: "契约和输入节点：定义 ProcessIdentity、ProcessIdentityProvider、KillTarget 与严格 XOR/保护/错误语义"
    exit_signal: "PID/name 互斥、wildcard/非法 PID/空目标均在 provider 前确定性拒绝；既有错误码字符串保持兼容"
    status: done
  - action: "平台 proof 节点：实现 Windows/Linux/macOS 精确枚举、identity token/start-time probe 和 PID-only/tree termination adapter"
    exit_signal: "唯一候选与 PID 都能取得可重验 proof；不会生成 /IM 或 pkill；平台能力不足时 fail-closed"
    status: done
  - action: "handler 编排节点：将 kill_process 接入 provider、critical/self/parent protection、SafeGuard 和有界成功确认"
    exit_signal: "重名、PID reuse、保护进程、终止失败和目标仍存活均返回结构化错误；成功只在 identity 消失后返回"
    status: done
  - action: "兼容 surface 节点：收敛 getKillSpec 为 verified PID-only，并同步现有 platform tests"
    exit_signal: "平台 spec 只包含已验证 PID 和 force/tree 语义；name 不再进入 taskkill /IM 或 Unix pkill"
    status: done
  - action: "验证节点：补 fake provider/executor、平台解析、无副作用和跨平台决策回归测试"
    exit_signal: "design 第 3 节场景都有类型/单测/静态或手工证据；build、tsc、lint、test、latency、coverage 通过"
    status: done

