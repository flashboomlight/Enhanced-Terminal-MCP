feature: 2026-08-22-pnpm-shared-dependency-store
created: 2026-08-22

steps:
  - action: "S1 基线与管理器契约：记录当前 manifest/lockfile、Node/pnpm 版本、store path、virtual-store 行为和非 C 盘写入位置；加入 pnpm manager pin"
    exit_signal: "pnpm 版本与 packageManager 契约一致；当前 shared store 位于非 C 盘；没有提前修改业务源码或 Adaptive 仓库"
    status: done
  - action: "S2 lockfile 转换：以现有 package-lock.json 为输入执行 pnpm import，审阅依赖版本、overrides、生命周期脚本和生成的 pnpm-lock.yaml，确认后移除 npm lockfile"
    exit_signal: "pnpm install --frozen-lockfile 可用；package.json 的依赖意图和 SDK override 未发生未授权升级；只有 pnpm-lock.yaml 作为项目 lockfile"
    status: done
  - action: "S3 项目隔离与共享内容验证：使用同一 pnpm content store 安装 Enhanced 和临时独立 consumer，检查各自 virtual store、node_modules、lockfile 和 runtime resolution"
    exit_signal: "两个项目复用同一 content store，但没有共享 node_modules、NODE_PATH、workspace:* 或手工跨项目链接；不同版本可以共存"
    status: done
  - action: "S4 工作流与文档对齐：将维护者安装、build、typecheck、lint、test、latency 和发布说明切换到 pnpm 表达，同时保留 npm consumer 安装兼容性"
    exit_signal: "README.md、AGENTS.md 和实际项目命令对 shared content store / project runtime 的区别描述一致；无 npx/npm 项目依赖回退"
    status: done
  - action: "S5 发布与全量验证：执行非 C 盘质量门禁、重复安装/离线复装、pnpm pack、clean npm consumer、运行时 smoke 和临时产物审计"
    exit_signal: "build、tsc、lint、全量测试、latency、package consumer 和范围反向核对全部通过；临时 consumer/cache 可清理且 shared store 不被删除"
    status: done

checks:
  - item: "package.json 声明 packageManager: pnpm@11.21.0，且实际 pnpm --version 与其一致"
    source: "design 0 / 1.3 manager pin"
    status: passed
  - item: "pnpm store path 解析到预期非 C 盘 content store；实现文件、package metadata、lockfile 和发布物不写死机器路径"
    source: "design 0 / 1.1 path boundary"
    status: passed
  - item: "Enhanced Terminal MCP 保持单根独立项目；没有新增跨 MCP pnpm-workspace.yaml、workspace:* 或父 workspace 注册"
    source: "design 0 out of scope / acceptance 7"
    status: passed
  - item: "现有 package.json 的 package name、version、main、bin、files、engines、dependencies、devDependencies、overrides 和 scripts 语义保持不变"
    source: "design 2.1 / acceptance 11"
    status: passed
  - item: "pnpm-lock.yaml 由现有 package-lock.json 导入生成，依赖版本和 @modelcontextprotocol/sdk override 没有未授权漂移"
    source: "design 1.3 / migration boundary"
    status: passed
  - item: "package-lock.json 不再作为第二个 active lockfile；pnpm install --frozen-lockfile 可在干净 checkout 成功"
    source: "design 0 success criteria / acceptance 1"
    status: passed
  - item: "Enhanced 与临时独立 consumer 使用同一个 pnpm content store，但各自拥有独立 lockfile、virtual store 和 node_modules"
    source: "design 2.2 / acceptance 3"
    status: passed
  - item: "依赖运行时解析来自 Enhanced 自己的 project entry point，不使用 NODE_PATH、其他 MCP 的 node_modules 或手工链接"
    source: "design 0 success criteria / acceptance 6"
    status: passed
  - item: "移除 Enhanced project node_modules 后，保留 shared store 并执行 offline/frozen reinstall 可复用已有内容"
    source: "design acceptance 4"
    status: passed
  - item: "临时 consumer 请求不同依赖版本时，shared store 可容纳多个版本，Enhanced 仍按自身 lockfile 解析"
    source: "design acceptance 5"
    status: passed
  - item: "README.md 和 AGENTS.md 的项目命令统一使用 pnpm；pnpm exec tsc、pnpm run build/lint/test/latency 均可执行"
    source: "design 2.4 workflow alignment"
    status: passed
  - item: "pnpm run build、pnpm exec tsc --noEmit、pnpm run lint、pnpm test、pnpm run test:latency 全部通过，且 MCP 工具行为无回归"
    source: "design 0 success criteria / acceptance 8"
    status: passed
  - item: "pnpm pack 结果不含 node_modules、virtual store、lockfile、测试临时数据或机器专属 store path"
    source: "design acceptance 9"
    status: passed
  - item: "clean npm consumer 使用非 C 盘 cache/temp 安装 tarball，并能启动 build/index.js；postinstall SDK patch 仍工作"
    source: "design acceptance 10"
    status: passed
  - item: "重复安装、build、test 和 pack 结果幂等；不产生第二个 lockfile、跨项目 runtime 目录或 C 盘缓存"
    source: "design acceptance 12"
    status: passed
  - item: "offline 缺包或 shared store 配置不可用时明确失败，不静默回退 npm 或 C 盘临时目录"
    source: "design acceptance 13-14"
    status: passed
  - item: "没有清理或删除既有 E:\\pnpm\\v11 shared store；只清理本次生成的项目依赖目录和临时 consumer"
    source: "design migration and uninstall boundary"
    status: passed
