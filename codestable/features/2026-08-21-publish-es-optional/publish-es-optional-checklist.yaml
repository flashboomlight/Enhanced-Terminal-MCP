feature: 2026-08-21-publish-es-optional
created: 2026-08-21
roadmap: merge-e-hardening-into-d
roadmap_item: publish-es-optional

steps:
  - action: "S1 解析编排骨架：建立 explicit/state/unavailable 结果和固定诊断字段，保留 ensureEsExeIntegrity 兼容入口"
    exit_signal: "resolver 能区分 explicit/state 来源与 unavailable 原因；无下载、无仓库路径默认读取"
    status: done
  - action: "S2 完整性计算节点：普通文件检查、fingerprint、固定 SHA-256、成功缓存和并发 in-flight"
    exit_signal: "文件替换后下一次调用重新 hash；错误路径不授权执行；并发首次解析不重复计算"
    status: done
  - action: "S3 搜索契约接入：search_files 的隐式 native fallback、显式 hard failure；everything_search 的结构化安装提示"
    exit_signal: "显式坏配置不 fallback；隐式缺失能 native 搜索；Everything 失败 detail 完整且 download_performed=false"
    status: done
  - action: "S4 发布裁剪：从 package.json files 移除 es_tool/es.exe，保留仓库 fixture 和现有二进制完整性测试边界"
    exit_signal: "npm pack --dry-run 不含 es.exe，仓库 fixture 未被删除，运行时无复制/下载路径"
    status: done
  - action: "S5 专项与全量验收：路径优先级、文件类型、hash/fingerprint、fallback、诊断、零下载和 package 门禁"
    exit_signal: "M3 专项、build、tsc、lint、全量测试、latency、npm pack dry-run、git diff --check 全部通过"
    status: done

checks:
  - item: "固定 SHA-256 与 64 位小写 hex 格式保持不变"
    source: "roadmap 4.13 / 名词契约"
    status: passed
  - item: "解析顺序固定为 ENHANCED_TERMINAL_ES_PATH → state-dir/tools/es.exe → unavailable"
    source: "roadmap 4.13 / 名词契约"
    status: passed
  - item: "显式路径不存在、非普通文件、不可读或 hash mismatch 时 fail-closed 且不尝试第二路径"
    source: "roadmap 4.13 / 验收契约"
    status: passed
  - item: "未显式配置且 state binary 不可用时 search_files 使用 native fallback"
    source: "roadmap 4.13 / 验收契约"
    status: passed
  - item: "everything_search binary 不可用时返回 EXECUTION_FAILED 与 reason/expected_sha256/env_name/default_path/download_performed=false"
    source: "roadmap 4.13 / 验收契约"
    status: passed
  - item: "每次调用先复核 fingerprint；size/mtime/file identity 变化触发重新 hash"
    source: "roadmap 4.13 / 完整性契约"
    status: passed
  - item: "并发首次解析共享 in-flight promise，成功缓存不绕过 fingerprint"
    source: "design 2.2 / 并发纪律"
    status: passed
  - item: "生产 resolver 不读取仓库 es_tool/es.exe；fixture 仅供显式测试使用"
    source: "roadmap 4.13 / 明确不做"
    status: passed
  - item: "安装期、postinstall、启动期和运行期均无下载调用"
    source: "roadmap 4.13 / 零下载"
    status: passed
  - item: "package.json files 不包含 es_tool/es.exe，npm pack --dry-run 不含 es.exe"
    source: "roadmap 4.13 / 发布门禁"
    status: passed
  - item: "非 Windows everything_search 保持 Windows-only 失败，不触发 resolver 下载"
    source: "roadmap 3.3 / 验收契约"
    status: passed
  - item: "现有工具数量、搜索参数、policy/SafeGuard/audit 语义不变"
